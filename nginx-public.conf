server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Default deny: this docroot is a full working repo (internal business/legal
    # documents, .git, .env, dev tooling) mounted read-only, not a curated web
    # root. Only the paths ByteCast's site actually serves are explicitly
    # allowed below; everything else 404s. When adding new site content,
    # add its path here rather than opening the whole tree.
    location / {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { try_files $uri =404; }
    location = /seed_bytecast.html { try_files $uri =404; }
    location = /favicon.svg { try_files $uri =404; }
    # Required ZIP export dependency; keep the rest of /vendor/ denied.
    location = /vendor/fflate.min.js { try_files $uri =404; }
    location = /template/index.html { try_files $uri =404; }
    location = /bytecast-season1.html { try_files $uri =404; }
    location = /lift_lab_bytecast_bundle/site/index.html { try_files $uri =404; }

    # Contributor onboarding: the former index page is an About/Fit Check page.
    # Route all legacy onboarding entry points to the actual training journey.
    location = /episodes/contributor.onboarding/ {
        return 302 https://bytecast.aerocoreos.com/episodes/contributor.onboarding/contributor_onboarding_ep0/index.html;
    }
    location = /episodes/contributor.onboarding/index.html {
        return 302 https://bytecast.aerocoreos.com/episodes/contributor.onboarding/contributor_onboarding_ep0/index.html;
    }
    # Preserve the former About page at an explicit URL.
    location = /episodes/contributor.onboarding/about.html {
        try_files /episodes/contributor.onboarding/index.html =404;
    }

    location ^~ /episodes/ { try_files $uri $uri/ =404; }
    location ^~ /assets/   { try_files $uri =404; }
    location ^~ /docs/     { try_files $uri =404; }
    location ^~ /data/     { try_files $uri =404; }
}
